---
name: Homebrew Formula CI

on:
  push:
    branches: [main]
    paths:
      - "Formula/**"
  pull_request:
    paths:
      - "Formula/**"

jobs:
  detect-changes:
    name: Determine changed formulae
    runs-on: macos-latest
    timeout-minutes: 5
    outputs:
      formulae: ${{ steps.changed.outputs.formulae }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine changed formulae
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          changed=""
          if [ -n "${base_sha}" ] && git rev-parse --verify --quiet "${base_sha}^{commit}" >/dev/null; then
            changed=$(git diff --name-only "${base_sha}" "${{ github.sha }}" -- 'Formula/*.rb')
          fi

          # Fall back to auditing every formula when there's no usable base
          # (e.g. force-push, new branch, or workflow_dispatch) so we never
          # silently skip a formula.
          if [ -z "${changed}" ]; then
            changed=$(ls Formula/*.rb)
          fi

          formulae=$(
            printf '%s\n' "${changed}" |
              sed -e 's#^Formula/##' -e 's#\.rb$##' |
              jq -R -s -c 'split("\n") | map(select(length > 0))'
          )

          echo "formulae=${formulae}" >> "$GITHUB_OUTPUT"

  formula-ci:
    name: Audit, install, and test (${{ matrix.formula }})
    needs: detect-changes
    if: needs.detect-changes.outputs.formulae != '[]'
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        formula: ${{ fromJson(needs.detect-changes.outputs.formulae) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      - name: Cache Homebrew downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-cache-${{ runner.os }}-${{ hashFiles('Formula/*.rb') }}
          restore-keys: |
            brew-cache-${{ runner.os }}-

      - name: brew audit --strict --online
        run: brew audit --strict --online "proinsias/tap/${{ matrix.formula }}"

      - name: brew install --build-from-source
        run:
          brew install --build-from-source "proinsias/tap/${{ matrix.formula }}"

      - name: brew test
        run: brew test "proinsias/tap/${{ matrix.formula }}"
